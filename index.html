<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trenecitos</title>
<meta name="description" content="¿Llegas al tren? Cercanías Madrid con datos abiertos de Renfe.">
<meta name="theme-color" content="#e5202a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button class="hdr-btn" id="menu" type="button" aria-label="Menú y ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="brand">
    <svg class="brand__mark" viewBox="76 98 360 316" aria-hidden="true"><path fill-rule="evenodd" d="M94 106H372C402 106 420 138 428 182H94Q84 182 84 172V116Q84 106 94 106ZM114 126h34v24h-34ZM164 126h34v24h-34ZM214 126h34v24h-34ZM264 126h34v24h-34ZM314 126h34v24h-34ZM94 218H322C352 218 370 250 378 294H94Q84 294 84 284V228Q84 218 94 218ZM114 238h34v24h-34ZM164 238h34v24h-34ZM214 238h34v24h-34ZM264 238h34v24h-34ZM94 330H272C302 330 320 362 328 406H94Q84 406 84 396V340Q84 330 94 330ZM114 350h34v24h-34ZM164 350h34v24h-34ZM214 350h34v24h-34Z"/></svg>
    <h1>Trenecitos</h1>
  </div>
  <button class="hdr-btn" id="add" type="button" aria-label="Añadir trayecto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button>
</header>

<p class="demo" id="demo" hidden>Datos de demostración · aún sin conectar con Renfe</p>

<div class="scroller" id="scroller">
<div class="ride-wrap"><div id="ride" hidden></div></div>

<main class="board" id="board" aria-live="off"></main>
<footer class="foot">Datos abiertos de Renfe Operadora · CC BY 4.0</footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" tabindex="-1"></aside>

<dialog class="dlg" id="askDlg" aria-labelledby="askT">
  <form method="dialog">
    <h2 id="askT" data-t="title"></h2>
    <p data-t="text"></p>
    <div class="dlg__btns">
      <button class="btn-add" value="no" data-t="no" autofocus></button>
      <button class="btn-add" value="ok" data-t="ok"></button>
    </div>
  </form>
</dialog>

<dialog class="dlg" id="exitDlg" aria-labelledby="exitT">
  <h2 id="exitT">¿Salir de Trenecitos?</h2>
  <p>Tienes marcado tu tren. Si sales de la app dejarás de ver cuánto te queda. Mejor minimízala con el botón de inicio y no la cierres.</p>
  <div class="dlg__btns">
    <button type="button" class="btn-add" data-t="stay" autofocus>Quedarme</button>
    <button type="button" class="btn-add btn-add--danger" data-t="leave">Salir</button>
  </div>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
